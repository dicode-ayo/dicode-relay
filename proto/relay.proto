// Protocol schema for the dicode relay WebSocket tunnel.
//
// Generated via protoc-gen-es → src/relay/pb/*.ts (`buf generate`).
//
// Wire format is JSON (WebSocket text frames) shaped by @bufbuild/protobuf's
// fromJson/toJson over the generated oneof envelopes.
//
// Protocol version: 4 (mTLS control channel). The daemon authenticates by
// presenting a self-signed TLS client certificate wrapping its P-256 signing
// key on the broker's dedicated mTLS listener; the broker derives
// uuid = hex(sha256(uncompressed_cert_pubkey)) from the peer certificate.
// There is no application-level challenge/signature exchange — channel
// binding comes from TLS 1.3 CertificateVerify.
//
// Both sides MUST reject connections where the peer advertises protocol < 4.

syntax = "proto3";

package dicode.relay.v1;

option go_package = "github.com/dicode/dicode/pkg/relay/pb;relaypb";

// ServerMessage is any message the relay server sends to the daemon.
// Wire form: a JSON object with one key identifying the variant, e.g.
//   {"welcome": {"url": "..."}}.
message ServerMessage {
  // Field 1 was the v3 TOFU handshake challenge.
  reserved 1;
  reserved "challenge";
  oneof kind {
    Welcome welcome = 2;
    Error error = 3;
    Request request = 4;
  }
}

// ClientMessage is any message the daemon sends to the relay server.
message ClientMessage {
  oneof kind {
    Hello hello = 1;
    Response response = 2;
  }
}

// Hello is the first frame the daemon sends after the TLS handshake.
// The daemon's signing identity travels in its TLS client certificate;
// hello only carries what TLS cannot: the ECIES recipient key.
message Hello {
  // Fields 1, 2, 4, 5 were the v3 TOFU handshake (uuid, sign pubkey,
  // challenge signature, timestamp) — all derived from or replaced by the
  // TLS client certificate.
  reserved 1, 2, 4, 5;
  reserved "uuid", "pubkey", "sig", "timestamp";
  // Base64 std-encoded 65-byte uncompressed P-256 public key (0x04 || X || Y).
  // Used as the ECIES recipient on OAuth token delivery.
  // Required — every daemon ships with a split sign/decrypt identity.
  string decrypt_pubkey = 3;
}

// Welcome acknowledges a successful handshake and hands the daemon its
// publicly reachable tunnel URL plus the broker's delivery-signing pubkey.
// The channel is TLS-server-authenticated, so the daemon can trust and
// persist broker_pubkey on every connect (no TOFU pinning).
message Welcome {
  // Full WSS URL for this client, e.g. wss://relay.dicode.app/u/<uuid>/hooks/
  string url = 1;
  // Base64-encoded SPKI DER public key the broker uses to sign delivery
  // envelopes. Absent for brokers that don't support OAuth delivery.
  optional string broker_pubkey = 2;
  // Protocol version announced by the broker. Daemons refuse < 4.
  optional int32 protocol = 3;
}

// Error is any server-side rejection mid-session (bad signature, stale
// timestamp, registry conflict, etc.). After sending Error the server closes
// the connection.
message Error {
  string message = 1;
}

// Request is an inbound HTTP request forwarded to the daemon.
message Request {
  // UUIDv4 used to correlate the response.
  string id = 1;
  string method = 2;
  string path = 3;
  map<string, HeaderValues> headers = 4;
  // Base64-encoded request body bytes.
  string body = 5;
}

// Response is the daemon's reply to a forwarded request.
message Response {
  // Matches the `id` from the corresponding Request.
  string id = 1;
  int32 status = 2;
  map<string, HeaderValues> headers = 3;
  // Base64-encoded response body bytes.
  string body = 4;
}

// HeaderValues wraps a list of strings so it can be the value type of a
// proto3 map (which does not allow repeated values directly). Both
// protojson and protobuf-es emit the inner `values` field on the wire.
message HeaderValues {
  repeated string values = 1;
}

// OAuthTokenDelivery is the body of the `/hooks/oauth-complete` webhook the
// broker forwards to the daemon after a successful OAuth exchange. It is
// transported inside a Request.body (base64-encoded JSON); this message type
// itself is not a ServerMessage variant.
//
// The ciphertext has the 16-byte AES-GCM authentication tag appended; the
// daemon must split the last 16 bytes off before passing to aesGCM.Open.
message OAuthTokenDelivery {
  string session_id = 1;
  // Base64-encoded uncompressed P-256 ephemeral public key (65 bytes).
  string ephemeral_pubkey = 2;
  // Base64-encoded ciphertext with auth tag appended.
  string ciphertext = 3;
  // Base64-encoded 12-byte AES-GCM nonce (IV).
  string nonce = 4;
  // Base64-encoded ECDSA P-256 signature over the v4 delivery preimage
  // (see shared/signing.ts buildDeliverySignaturePayload: domain label +
  // length-prefixed fields). Signed by the broker's long-lived key announced
  // in Welcome.broker_pubkey.
  optional string broker_sig = 5;
}
